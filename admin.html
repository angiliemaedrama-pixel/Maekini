<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaeKini | Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="adminPage">
    <main class="adminWrap">
        <div class="adminHeader">
            <div>
                <span>MAEKINI.COM</span>
                <h1>Admin Dashboard</h1>
                <p>Sign in to monitor registered customers.</p>
            </div>
            <a href="/">Back to Store</a>
        </div>

        <section id="adminLogin" class="card adminLogin" aria-labelledby="adminLoginTitle">
            <h2 id="adminLoginTitle">Admin Sign In</h2>
            <form id="adminLoginForm">
                <label for="adminUsername">Username</label>
                <input id="adminUsername" name="username" type="text" autocomplete="username" value="admin" required>
                <label for="adminPassword">Password</label>
                <input id="adminPassword" name="password" type="password" autocomplete="current-password" required>
                <button class="btn" type="submit">Sign in</button>
            </form>
            <p class="adminHelp">Use the admin credentials configured for the server.</p>
            <p id="adminMessage" role="status" aria-live="polite"></p>
        </section>

        <section id="adminDashboard" class="card" hidden aria-labelledby="customerHeading">
            <div class="adminTableTop">
                <div>
                    <h2 id="customerHeading">Registered Customers</h2>
                    <p id="customerCount">Loading customer list...</p>
                </div>
                <div>
                    <button id="refreshCustomers" class="btn" type="button">Refresh</button>
                    <button id="adminSignOut" class="light" type="button">Sign out</button>
                </div>
            </div>
            <p id="dashboardMessage" role="status" aria-live="polite"></p>
            <div class="tableScroll">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Name</th>
                            <th scope="col">Email</th>
                            <th scope="col">Registered</th>
                            <th scope="col">Last Login</th>
                        </tr>
                    </thead>
                    <tbody id="customerRows"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="admin.js" defer></script>
</body>
</html>
